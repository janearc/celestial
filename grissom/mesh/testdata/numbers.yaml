# numbers.yaml: the numbers the mesh's tests are held to.

numbers:
  - name: area-rounding
    value: 1e-12
    unit: steradians
    says: how far a sum of areas may land from the area it should make; the faces' 4 pi comes out to the last bit, and a depth-27 cell is 4e-17
    kind: picked
    by: celestial's grissom mesh tests, 2026-11-02
  - name: angle-rounding
    value: 1e-12
    unit: radians
    says: how far past a cell's farthest corner a place in it may seem to lie, from float64's rounding of its unit vectors
    kind: picked
    by: celestial's grissom mesh tests, 2026-11-02
  - name: area-share
    value: 1e-9
    unit: a share of the parent's area
    says: how far four children's areas may sum from their parent's, as a share of it; at depth 12 a cell's edge is 3e-4 radians, so float64 leaves about 1e-12 of it
    kind: picked
    by: celestial's grissom mesh tests, 2026-11-02
  - name: sgra-ra
    value: 266.4168371
    unit: degrees
    says: the right ascension the layout pin is taken at, Sgr A*'s as the Sgr A* page used it
    kind: picked
    by: celestial's grissom mesh tests, 2026-11-02
  - name: sgra-dec
    value: -29.0078106
    unit: degrees
    says: the declination the layout pin is taken at, Sgr A*'s as the Sgr A* page used it
    kind: picked
    by: celestial's grissom mesh tests, 2026-11-02
  - name: pinned-depth
    value: 10
    unit: steps
    says: the depth the layout pin is taken at, deep enough that every bit of the path and the face is held
    kind: picked
    by: celestial's grissom mesh tests, 2026-11-02
  - name: pinned-face
    value: 1
    unit: a face's place
    says: the face Sgr A*'s cell began on when the layout was pinned on 2026-11-02; a change here is a change to every key the page has been given
    kind: picked
    by: celestial's grissom mesh tests, 2026-11-02
  - name: pinned-path
    value: 930350
    unit: a path of steps, two bits each
    says: the path down from that face to Sgr A*'s cell at the pinned depth when the layout was pinned on 2026-11-02
    kind: picked
    by: celestial's grissom mesh tests, 2026-11-02
  - name: edge-steps
    value: 8
    unit: parts of an edge
    says: how many parts each face's edges are cut into, a place at each cut but the ends; on 2026-11-02, before Locate took the nearest child, 159,552 of 359,640 places along the edges at 999 cuts each failed at depths 1 to 27, so seven an edge find it many times over
    kind: picked
    by: veronica, 2026-11-02
