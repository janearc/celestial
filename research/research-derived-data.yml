  # the share of a star's mass that becomes helium on the main
  # sequence: picked, not measured, carried from slayer's stars.

  - name: burned-share
    value: 0.1
    unit: ""
    says: the share of a star's mass that becomes helium while it burns hydrogen on the main sequence, about a tenth in stellar models
    kind: picked
    by: "slayer's stars (2026-10), after carroll and ostlie's introduction to modern astrophysics; too small past about twenty suns"

  # how many bands bands cuts each octave of wavelength into: picked,
  # not derived, on colour evidence, carried from libtheme-css.

  - name: bands-per-octave
    value: 24
    unit: ""
    says: how many bands of light there are for every doubling of wavelength
    kind: picked
    by: "libtheme-css's bands (2026-10), chosen against colours drawn whole; its FUDGE.md, under bands, holds the steps tried"

  # how steep grissom's logarithmic stretch is: picked, as saoimage ds9's
  # default log exponent was recalled, not read from ds9.

  - name: log-stretch
    value: 1000
    unit: ""
    says: how steep grissom's logarithmic stretch is; a value x shows as log(1 + 1000 x) / log(1 + 1000)
    kind: picked
    by: "celestial's grissom composite (2026-11-02), as saoimage ds9's default log exponent is recalled; not read from ds9, and the curve is not held to ds9's"

  - name: cosmos-years
