    says: the age of the universe
    kind: measured
    source:
      key: planck-2018-vi
      where: table 2, age [Gyr], TT,TE,EE+lowE+lensing+BAO 68% limits
      text: "13.787 ± 0.020"

  # bodhaine, wood, dutton and slusser, "on rayleigh optical depth
  # calculations" (1999), the numbers their equations use, carried from
  # slayer's atmosphere and read on 2026-10-31 against the paper: each
  # number below that cites it is printed there as here, its digits
  # grouped in threes as the journal prints them. reading moved three
  # wheres: list's sea-level terms are its equation 11 and his height
  # terms its equation 10 (slayer had them the other way round); n_s is
  # printed beside equation 22, which equation 24 computes; and the
  # molar mass is printed after equation 17. peck and reeder's range,
  # 0.23 to 1.69 microns, is not in this paper; it is cited to theirs.

  - name: rayleigh-molecules-cm3
    value: 2.546899e19
    unit: cm^-3
    says: molecules of air in a cubic centimetre at 288.15 K and 1013.25 mb
    kind: measured
    source: {key: bodhaine-1999, where: "the text beside equation 22, n_s, which equation 24 computes", text: "2.546899e19"}

  - name: peck-reeder-constant
