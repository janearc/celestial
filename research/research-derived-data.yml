  # radiation's named ranges, iso 21348:2007's, in nanometres, each from
  # its short end up to but not including its long end, as the standard
  # writes them. the standard is sold, not open, so each is read in a
  # copy that is: the published text's own first pages, which a reseller
  # serves free and which reach clause 6.5, and past 6.5 the proof the
  # lead author's company serves. where the two overlap, 6.3 to 6.5,
  # they agree word for word. pdftotext writes the standard's
  # less-than-or-equal as u, and the text here is as it reads there.
  #
  # x-rays are hard and soft together: hard's short end, soft's long.
  # extreme ultraviolet ends at 121, as published (6.5.3); the draft's
  # account (tobiska and nusinov, cospar 2004, section 3, in
  # cited-sources) said 120, and radiation carried 120 until this.

  - name: gamma-ray-short
    value: 1e-5
    unit: nm
    says: where iso 21348's gamma rays begin, their shortest wavelength
    kind: measured
    source: {key: iso-21348-2007, where: "clause 6.3, gamma-rays", page: 10, text: "(0,000 01 u λ < 0,001) nm"}

  - name: gamma-ray-long
    value: 1e-3
    unit: nm
    says: where iso 21348's gamma rays end and x-rays begin
    kind: measured
    source: {key: iso-21348-2007, where: "clause 6.3, gamma-rays", page: 10, text: "(0,000 01 u λ < 0,001) nm"}

  - name: x-ray-short
    value: 1e-3
    unit: nm
