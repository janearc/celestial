# research-derived-data.yml: every measured number celestial uses, each read
# from its published source each names its source by its key in sources.yaml,
# beside this file, where in it, and the text printed there.
#
# a number carried over from slayer, libtheme-css or libholemath came
# with the citation its comment gave. those not yet read against the
# page say so in the comment above them, and their source's read in
# sources.yaml begins "not yet"; for them the text is the number as the
# code it was carried from typed it, not the page's own print. the
# research tests hold every such number to the ledger in
# testdata/unread.json, so none goes unlisted.

numbers:
  # codata's newtonian constant of gravitation, read on 2026-10-30
  # from the page itself, which says "Source: 2022
  # CODATA". its concise form there is "6.674 30(15) x 10-11 m3 kg-1
  # s-2", a relative standard uncertainty of 2.2e-5.

  - name: gravitation
    value: 6.67430e-11
    unit: m^3 kg^-1 s^-2
    says: the newtonian constant of gravitation, G
    kind: measured
    source:
      key: codata-2022-g
      where: numerical value
      text: "6.674 30 x 10-11 m3 kg-1 s-2"

  # codata 2022's values for the electron, the proton and the atomic
  # mass constant, each as an energy, and the fine-structure constant,
  # read on 2026-10-31 from nist's pages for each, all of which say
  # "Source: 2022 CODATA". slayer's measure carried the 2018 values.

  - name: fine-structure
    value: 7.2973525643e-3
    unit: ""
    says: the fine-structure constant, alpha, how strongly light and charge couple
    kind: measured
    source:
      key: codata-2022-alpha
      where: numerical value
      text: "7.297 352 5643 x 10-3"

  - name: electron-mev
    value: 0.51099895069
    unit: MeV
    says: the electron's mass, as the energy it is at rest
    kind: measured
    source:
      key: codata-2022-electron-mev
      where: numerical value
      text: "0.510 998 950 69 MeV"

  - name: proton-mev
    value: 938.27208943
    unit: MeV
    says: the proton's mass, as the energy it is at rest
    kind: measured
    source:
      key: codata-2022-proton-mev
      where: numerical value
      text: "938.272 089 43 MeV"

  - name: dalton-mev
    value: 931.49410372
    unit: MeV
    says: the atomic mass constant, a twelfth of a carbon 12 atom, as the energy it is at rest
    kind: measured
    source:
      key: codata-2022-dalton-mev
      where: numerical value
      text: "931.494 103 72 MeV"

  # the atomic masses of hydrogen 1 and helium 4, from the atomic mass
  # evaluation of 2020, table I, which gives each atomic mass in micro-u,
  # read on 2026-10-31 from the paper as the atomic mass data centre
  # serves it. slayer's measure carried 1.00782503223 for hydrogen 1,
  # which is not the table's: the table prints 1 007825.03190, plus or
  # minus 0.00001, and that is the value here now. helium 4 was as the
  # table has it.

  - name: hydrogen-1-daltons
    value: 1.00782503190
    unit: Da
    says: the mass of a hydrogen 1 atom, its electron and all
    kind: measured
    source:
      key: ame-2020
      where: table I, 1 H, atomic mass in micro-u
      text: "1 007825.03190"

  - name: helium-4-daltons
    value: 4.00260325413
    unit: Da
    says: the mass of a helium 4 atom, its electrons and all
    kind: measured
    source:
      key: ame-2020
      where: table I, 4 He, atomic mass in micro-u
      text: "4 002603.25413"

